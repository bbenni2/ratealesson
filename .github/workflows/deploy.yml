name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # erlaubt manuelles Neu-Deployen per Knopfdruck

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Pfad-Präfix für GitHub Pages (Repo-Name!)
          VITE_BASE: /ratealesson/
          # Supabase-Zugangsdaten (im Repo unter Settings → Secrets and
          # variables → Actions → Variables anlegen). anon-Key ist öffentlich.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: SPA-Fallback (Deep-Links nicht auf 404)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
